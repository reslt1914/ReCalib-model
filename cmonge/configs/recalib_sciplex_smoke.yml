model:
  method: monge
  fitting_loss:
    name: sinkhorn
    kwargs:
      epsilon_fitting: 1
  regularizer:
    name: monge
    kwargs:
      epsilon_regularizer: 0.01
      cost: euclidean
  optim:
    lr: 0.0001
    name: adamw
    kwargs:
      weight_decay: 1.0e-05
  mlp:
    dim_hidden:
    - 64
    - 64
    - 64
    - 64
    dim_data: 50
    context_entity_bonds:
    - - 0
      - 194
    - - 0
      - 195
    dim_cond: 195
    dim_cond_map: 50
  embedding:
    name: rdkit
    smile_path: data/lincs_trapnell.smiles
    drug_to_smile_path: data/recalib_sciplex_main_metadata/cmonge_drug_smiles.csv
    model_dir: models/embed/recalib/
    checkpoint: true
  num_train_iters: 100
  seed: 42
data:
  name: sciplex
  file_path: data/recalib_sciplex_smoke.h5ad
  batch_size: 512
  split:
  - 0.8
  - 0.2
  - 0.0
  drug_col: drug-dose
  drug_condition: d0fb97df288bd-10000
  control_condition: control-0
  seed: 42
  ae: false
  reduction: ae
  ae_config_path: null
condition:
  mode: homogeneous
  conditions:
  - d0fb97df288bd-10000
  - d6caaa23821b8-10000
  - dcdfb7c0d0450-10000
  - de722c4982894-10000
  - d834f99300567-10000
  - dfd5eecfc7436-10000
  split:
  - 0.8
  - 0.2
  - 0.0
ae:
  model:
    hidden_dims:
    - 512
    - 512
    latent_dim: 50
    data_dim: 977
    seed: 1
    act_fn: gelu
  optim:
    lr: 0.0001
    optimizer: adamw
    kwargs:
      weight_decay: 1.0e-05
  training:
    n_epochs: 50
    valid: false
    ckpt: false
    model_dir: models/recalib_smoke/
